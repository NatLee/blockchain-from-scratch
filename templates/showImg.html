<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Show image</title>
</head>
<style>
body {
	background:#555;
}
.centered {
  position: fixed;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
}
.button {
  display: inline-block;
  border-radius: 4px;
  background-color: #878787 ;
  border: none;
  color: #FFFFFF;
  text-align: center;
  font-size: 28px;
  padding: 20px;
  width: 200px;
  transition: all 0.5s;
  cursor: pointer;
  margin: 5px;
}

.button span {
  cursor: pointer;
  display: inline-block;
  position: relative;
  transition: 0.5s;
}

.button span:after {
  content: '»';
  position: absolute;
  opacity: 0;
  top: 0;
  right: -20px;
  transition: 0.5s;
}

.button:hover span {
  padding-right: 25px;
}

.button:hover span:after {
  opacity: 1;
  right: 0;
}
</style>

<body>
  <div align="center" class="centered">
    {% for item in imgs %}
        <!--<img src="{{ item.img_url.url }}"><br/>-->
        <img src="data:image/gif;base64,{{ item.base64Data }}"><br/>
        {{ item.sig }}
    {% endfor %}
    <br/><button class="button" style="vertical-align:middle" onclick="location.href='/searchImg/'"><span>Back</span></button>
  </div>
</body>
</html>
