[package]
name = "blockchain-from-scratch"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
aes-gcm = "0.11"
base64 = "0.23"
ed25519-dalek = "3"
flate2 = "1"
getrandom = "0.4"
hex = "0.4"
hkdf = "0.13"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
thiserror = "2"
x25519-dalek = { version = "3", features = ["static_secrets"] }

